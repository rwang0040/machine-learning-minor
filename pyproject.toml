[project]
name = "machinelearning-course"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "jupyterlab==4.6.4",
  "ipykernel==7.4.0",
]

[dependency-groups]
verification = ["nbformat==5.11.1", "nbclient==0.11.0", "psutil==7.2.2"]

[tool.uv]
package = false

prerelease = "disallow"
